[project]
name = "ytasty-crousty-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
